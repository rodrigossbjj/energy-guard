version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: energyguard-postgres
    environment:
      POSTGRES_DB: energyguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
      - "5433:5432" # backup port mapping if needed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
